name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker Image
        run: docker build -t khawlagr12/my-docker-app:latest .

      - name: Run Tests
        run: docker run --rm khawlagr12/my-docker-app:latest ./run-tests.sh

      - name: Push Docker Image
        run: docker push khawlagr12/my-docker-app:latest

      - name: Set up kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Deploy to Kubernetes
        run: kubectl --kubeconfig=kubeconfig apply -f k8s/deployment.yaml
