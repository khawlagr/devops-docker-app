name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: khawlagr12  # Remplacez par votre vrai username Docker Hub

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Docker Image
        run: docker build -t my-docker-app .
        
      - name: Test Docker Image
        run: |
          docker run -d -p 8080:80 --name test-container my-docker-app
          sleep 5
          curl --fail http://localhost:8080 || (echo "Test failed" && exit 1)
          docker stop test-container
          
      - name: Tag for Docker Hub
        run: docker tag my-docker-app ${{ env.DOCKERHUB_USERNAME }}/my-docker-app:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Push to Docker Hub
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/my-docker-app:latest