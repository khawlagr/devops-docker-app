name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Build Docker Image
        run: docker build -t my-docker-app .

      - name: Run Container and Execute Tests
        run: |
          docker run -d -p 8080:80 --name test-container my-docker-app
          sleep 3
          curl --fail http://localhost:8080 || (echo "Test failed: Unable to reach localhost:8080" && exit 1)
          docker stop test-container

      - name: Tag for Docker Hub
        run: docker tag my-docker-app khawlagr12/my-docker-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u khawlagr12 --password-stdin

      - name: Push Docker Image
        run: docker push khawlagr12/my-docker-app:latest

      - name: Deploy to Kubernetes
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig
          kubectl --kubeconfig=kubeconfig apply -f k8s/deployment.yaml